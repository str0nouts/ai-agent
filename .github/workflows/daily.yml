name: Daily Crypto Analysis

on:
  schedule:
    - cron: "0 1 * * *"  # jam 8 pagi WIB = jam 1 UTC
  workflow_dispatch:      # tombol untuk run manual dari GitHub

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node belajar.js